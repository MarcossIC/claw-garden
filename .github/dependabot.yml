# Keeps the commit SHAs the workflows pin their actions to current, in one pull
# request a month against develop. Crates are not updated here: the Advisories
# workflow reports the ones that need it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
