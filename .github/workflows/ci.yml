name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '.claude/**'
      - '.cursor/**'
      - '.gemini/**'
      - 'scripts/**'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '.claude/**'
      - '.cursor/**'
      - '.gemini/**'
      - 'scripts/**'
      - 'README.md'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only pull requests run the suite: a push to main merges one whose run tested
  # the same content.
  test:
    name: test (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      # This workflow is what release.yml waits for, so its actions are pinned
      # as there, and the token does not stay in .git/config for the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.99.1
          components: clippy
      # Pull requests only read the cache, which cache.yml writes from main, so
      # what a build script of a pull request leaves there never reaches main.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      # Compiler warnings are errors; clippy's own lints are not enforced yet.
      # --locked everywhere: a Cargo.lock that trails Cargo.toml fails here
      # instead of in release.yml, after the merge.
      - run: cargo clippy --locked --workspace --all-targets -- -A clippy::all -D warnings
      # Includes crates/clawg-cli/tests/binary.rs, which runs the built binary
      # against a temporary home with the fake model: nothing is downloaded.
      - run: cargo test --locked --workspace
      # What release.yml builds: --workspace turns on clawg-core's `testing` and
      # `eval`, and without --all-targets no dev-dependency, so neither, is in.
      - run: cargo clippy --locked -p clawg-cli -- -A clippy::all -D warnings
      # The build_info tests of a build without `testing`. build_info has no
      # platform code, so Linux alone runs them.
      - run: cargo test --locked -p clawg-core --lib build_info
        if: runner.os == 'Linux'

  # release.yml waits for a successful CI run of the push to main, and a run
  # whose jobs were all skipped is not one.
  merged:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "The pull request this push merged ran the suite."
