name: CI

# the_claude_md_tool_list_is_the_registered_one reads `.claude/CLAUDE.md`, so a
# push that changes only that file is checked by the next run.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '.claude/**'
      - '.cursor/**'
      - '.gemini/**'
      - 'scripts/**'
      - 'README.md'
      - 'AGENTS.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '.claude/**'
      - '.cursor/**'
      - '.gemini/**'
      - 'scripts/**'
      - 'README.md'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Compiler warnings are errors; clippy's own lints are not enforced yet.
      - run: cargo clippy --workspace --all-targets -- -A clippy::all -D warnings
      # Includes crates/clawg-cli/tests/binary.rs, which runs the built binary
      # against a temporary home with the fake model: nothing is downloaded.
      - run: cargo test --workspace
