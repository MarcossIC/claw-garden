name: Cache

# Writes, from main, the build cache that ci.yml's pull requests read, so no
# pull request's build script reaches it. ci.yml builds nothing on main, so this
# builds what its `test` job tests, without running the tests. It is not named
# CI, so release.yml does not wait for it.
on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/cache.yml'
  # GitHub evicts a cache nobody restored for seven days.
  schedule:
    - cron: '23 5 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # rust-cache keys a cache by job id, runner, CARGO_/RUST environment and lock,
  # never by workflow: this job keeps the id and environment of ci.yml's job, so
  # the cache it writes is the one that job restores.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --no-run
      - run: cargo clippy --locked -p clawg-cli -- -D warnings
      - run: cargo test --locked -p clawg-core --lib build_info --no-run
        if: runner.os == 'Linux'
