[package]
name = "clawg-desktop"
description = "Claw Garden desktop app"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "clawg_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
clawg-core.workspace = true

serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
regex.workspace = true
reqwest.workspace = true
futures.workspace = true
async-trait.workspace = true
uuid.workspace = true
log.workspace = true
dashmap.workspace = true
globset.workspace = true
once_cell.workspace = true
rusqlite.workspace = true
tokio-rusqlite.workspace = true
fastembed.workspace = true
tokenizers.workspace = true

rmcp = { version = "1", features = ["client", "transport-child-process"] }
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
# `testing` re-opens clawg-core's in-memory store constructor and test helpers,
# which were `#[cfg(test)]`-visible to this code before the crate split.
clawg-core = { workspace = true, features = ["testing"] }
# Enables tokio::time::pause() / advance() and #[tokio::test(start_paused = true)]
# for time-controlled async tests without real sleeps.
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
