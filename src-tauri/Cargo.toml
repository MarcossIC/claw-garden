[package]
name = "agent-office"
version = "0.1.0"
description = "AgentOffice - Virtual 2D office with AI agents"
authors = ["MarcossIC"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "agent_office_lib"
crate-type = ["rlib"]

[features]
eval = []

# Directory name matches the declared bin name so cargo's `src/bin/*/main.rs`
# autodiscovery converges on this same target instead of minting a second,
# required-features-less one from the same path.
[[bin]]
name = "rag-eval"
path = "src/bin/rag-eval/main.rs"
required-features = ["eval"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros", "time", "rt", "process", "io-util"] }
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "1", features = ["client", "transport-child-process"] }
log = "0.4"
dirs = "6"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
dashmap = "6"
globset = "0.4"
once_cell = "1"

# RAG foundations (Phase 1)
tokio-rusqlite = "0.7"
rusqlite        = { version = "0.37", features = ["bundled", "load_extension", "functions"] }
refinery        = { version = "0.9", features = ["rusqlite"] }
sqlite-vec      = "0.1"
siphasher       = "1.0"

# RAG Phase 2 (embedder)
# NOTE: design.md §9 named feature "ort-download-binaries-rustls-tls" but fastembed v5
# does not expose that feature. Available ORT features are `ort-download-binaries` and
# `ort-load-dynamic`. The `-rustls-tls` suffix only exists on the `hf-hub-rustls-tls`
# feature, which we INTENTIONALLY drop (we own the download path via reqwest+rustls,
# never fastembed's built-in hf-hub). Using `ort-download-binaries` is the correct
# minimal config for "offline init from bytes" usage.
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries"] }
fs2 = "0.4"

# RAG Phase 3 (ingest)
tree-sitter            = "0.26"
tree-sitter-rust       = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python     = "0.25"
tokenizers             = { version = "0.22.2", default-features = false }

# libc is used on Unix for process-group kill (kill(-PGID, SIGKILL)).
# Declared explicitly even though it is almost certainly a transitive
# dependency (tokio, tauri) — relying on implicit resolution is fragile.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Enables tokio::time::pause() / advance() and #[tokio::test(start_paused = true)]
# for time-controlled async tests without real sleeps.
tokio = { version = "1", features = ["sync", "macros", "time", "rt", "process", "io-util", "test-util"] }
mockito = "1"
tempfile = "3"
