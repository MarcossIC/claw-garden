[workspace]
resolver = "2"
members = ["crates/clawg-core", "crates/clawg-eval", "src-tauri"]

[workspace.package]
version = "0.1.0"
authors = ["MarcossIC"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# Dependencies shared by two or more workspace members. Version choices are
# unchanged from the pre-split `src-tauri/Cargo.toml`.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "macros", "time", "rt", "process", "io-util"] }
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
dirs = "6"
sha2 = "0.10"
unicode-normalization = "0.1"
base64 = "0.22"
rand = "0.9"
dashmap = "6"
globset = "0.4"
once_cell = "1"

# RAG foundations (Phase 1)
tokio-rusqlite = "0.7"
rusqlite = { version = "0.37", features = ["bundled", "load_extension", "functions"] }
refinery = { version = "0.9", features = ["rusqlite"] }
sqlite-vec = "0.1"
siphasher = "1.0"

# RAG Phase 2 (embedder)
# NOTE: design.md §9 named feature "ort-download-binaries-rustls-tls" but fastembed v5
# does not expose that feature. Available ORT features are `ort-download-binaries` and
# `ort-load-dynamic`. The `-rustls-tls` suffix only exists on the `hf-hub-rustls-tls`
# feature, which we INTENTIONALLY drop (we own the download path via reqwest+rustls,
# never fastembed's built-in hf-hub). Using `ort-download-binaries` is the correct
# minimal config for "offline init from bytes" usage.
fastembed = { version = "5", default-features = false, features = ["ort-download-binaries"] }
fs2 = "0.4"

# RAG Phase 3 (ingest)
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tokenizers = { version = "0.22.2", default-features = false }

libc = "0.2"
mockito = "1"
tempfile = "3"

clawg-core = { path = "crates/clawg-core" }
