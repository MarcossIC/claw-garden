[package]
name = "clawg-eval"
description = "Claw Garden retrieval evaluation harness (not distributed)"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

# No library target: this crate is only the evaluation binaries.
autobins = false

# Directory name matches the declared bin name so cargo's `src/bin/*/main.rs`
# autodiscovery converges on this same target instead of minting a second one
# from the same path.
[[bin]]
name = "rag-eval"
path = "src/bin/rag-eval/main.rs"

# Authoring tool for the golden set, kept out of `rag-eval` on purpose: that
# binary measures retrieval quality, and a measuring instrument must not also
# build the yardstick it measures against.
[[bin]]
name = "golden-mine"
path = "src/bin/golden-mine/main.rs"

# Measures the contradiction detector through the production ingest worker.
[[bin]]
name = "conflict-eval"
path = "src/bin/conflict-eval/main.rs"

# Measures what a topic key does for a memory that is revised.
[[bin]]
name = "revision-eval"
path = "src/bin/revision-eval/main.rs"

[dependencies]
clawg-core = { workspace = true, features = ["eval"] }
# Only `rag-eval --agent-view` and `revision-eval` use it: they serve the daemon's
# own router in-process so the text they measure is the text an agent receives.
clawg-cli.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
log.workspace = true
# `conflict-eval` gives every labelled pair a store of its own.
tempfile.workspace = true

# Measures the memory peak and the time of loading the model, by arm, one
# process per load.
[[bin]]
name = "load-eval"
path = "src/bin/load-eval/main.rs"

[target.'cfg(windows)'.dependencies]
# The job object that reports the peak commit of one load. Same version as
# `clawg-cli`, so the lock gains no package.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
